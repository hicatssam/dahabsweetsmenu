<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#100d09" />
  <title>دهب — قائمة الأصناف</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: dark; --gold: #d6a82c; --gold-soft: #f8dfa0; }
    html, body { margin: 0; min-height: 100%; }
    body { font-family: Tahoma, Arial, sans-serif; color: var(--gold-soft); background: radial-gradient(ellipse at top, #352714 0, #100d09 45%, #050505 100%); }
    button { font: inherit; }
    button:focus-visible, .viewer:focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 4px; }
    .app { min-height: 100svh; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 14px); }
    .header { width: min(100%, 760px); display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    h1 { margin: 0; font-size: 20px; font-weight: 700; }
    .subtitle { margin: 5px 0 0; color: #b9a784; font-size: 12px; }
    .btn, .section-btn { border: 1px solid #66512c; color: var(--gold-soft); background: #211a11; cursor: pointer; transition: background .18s, transform .18s, border-color .18s; }
    .btn { min-height: 44px; padding: 10px 16px; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; }
    .btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; }
    .btn:active, .section-btn:active { transform: scale(.96); }
    .btn:disabled { opacity: .35; cursor: default; transform: none; }
    .sections { width: min(100%, 760px); display: flex; gap: 7px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: thin; scrollbar-color: #66512c transparent; }
    .section-btn { flex: 0 0 auto; border-radius: 999px; min-height: 44px; padding: 8px 14px; font-size: 13px; }
    .section-btn[aria-current="page"] { background: var(--gold-soft); border-color: var(--gold-soft); color: #211a11; }
    .viewer { position: relative; width: min(100%, calc(clamp(280px, 100svh - 225px, 960px) * 2245 / 4371)); aspect-ratio: 2245 / 4371; perspective: 2000px; touch-action: pan-y pinch-zoom; user-select: none; }
    .magazine { width: 100%; height: 100%; position: relative; perspective: 2000px; }
    .page-stack { position: absolute; inset: 4px -4px -4px 4px; border-radius: 10px; background: #b6ad97; box-shadow: 0 18px 40px #0007; }
    .page, .flip-page { position: absolute; inset: 0; overflow: hidden; border-radius: 8px; background: #fff; backface-visibility: hidden; }
    .page { z-index: 1; }
    .page::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, #0000000a, transparent 7%, transparent 97%, #00000012); }
    .page img, .flip-page img { width: 100%; height: 100%; object-fit: contain; display: block; -webkit-user-drag: none; }
    .flip-page { z-index: 2; display: none; pointer-events: none; transform-origin: right center; }
    .flip-page.active { display: block; will-change: transform; }
    .flip-page::after { content: ''; position: absolute; inset: 0; background: linear-gradient(270deg, #0004, transparent 35%); animation: turnShade .52s ease-in-out; }
    .flip-page.next-open { animation: turnNext .52s cubic-bezier(.4,0,.2,1) forwards; }
    .flip-page.prev-open { animation: turnPrev .52s cubic-bezier(.4,0,.2,1) forwards; }
    @keyframes turnNext { from { transform: rotateY(0); } to { transform: rotateY(100deg); } }
    @keyframes turnPrev { from { transform: rotateY(100deg); } to { transform: rotateY(0); } }
    @keyframes turnShade { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
    .controls { width: min(100%, 480px); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; margin-top: 4px; }
    .counter { font-size: 15px; min-width: 65px; text-align: center; font-variant-numeric: tabular-nums; }
    .hint { margin: 0; color: #b9a784; text-align: center; font-size: 12px; }
    .status { color: #f8dfa0; margin: 0; text-align: center; font-size: 13px; }
    .status:empty { display: none; }
    dialog { width: min(98vw, 1100px); max-height: 94svh; padding: 0; border: 1px solid #66512c; border-radius: 16px; background: #100d09; color: var(--gold-soft); }
    dialog::backdrop { background: #000d; }
    .zoom-toolbar { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px; background: #100d09; z-index: 1; }
    .zoom-scroll { overflow: auto; max-height: 78svh; direction: ltr; }
    .zoom-scroll img { display: block; width: 100%; height: auto; max-width: none; }
    @media (hover: hover) { .btn:not(:disabled):hover, .section-btn:hover { background: #3b2b14; border-color: var(--gold); } .section-btn[aria-current="page"]:hover { background: var(--gold-soft); } }
    @media (max-width: 420px) { .app { padding-inline: 10px; gap: 10px; } h1 { font-size: 18px; } .btn { padding-inline: 12px; } .controls { gap: 8px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div><h1>دهب <span aria-hidden="true">—</span> قائمة الأصناف</h1><p class="subtitle">لحظاتك الحلوة تبدأ هون</p></div>
      <button class="btn" id="zoomBtn" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6M7 10h6M10 7v6"/></svg>تكبير</button>
    </header>
    <nav class="sections" id="sections" aria-label="أقسام المنيو"></nav>
    <section class="viewer" id="viewer" aria-label="صفحات قائمة دهب" tabindex="0">
      <div class="magazine"><div class="page-stack" aria-hidden="true"></div><div class="page" id="pageBox"></div><div class="flip-page" id="flipPage" aria-hidden="true"></div></div>
    </section>
    <div class="controls" aria-label="التنقل بين الصفحات">
      <button class="btn" id="prevBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>السابق</button>
      <span class="counter" id="counter" aria-live="polite" aria-atomic="true"></span>
      <button class="btn" id="nextBtn">التالي<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button>
    </div>
    <p class="hint">اسحب لليمين للتالي، ولليسار للسابق · اضغط تكبير لقراءة الأسعار</p>
    <p class="status" id="status" role="status"></p>
  </main>
  <dialog id="zoomDialog" aria-labelledby="zoomTitle">
    <div class="zoom-toolbar"><span id="zoomTitle">قراءة المنيو</span><button class="btn" id="zoomScale" aria-pressed="false">تكبير أكثر +</button><button class="btn" id="closeZoom">إغلاق ×</button></div>
    <div class="zoom-scroll" id="zoomScroll"><img id="zoomImage" alt="" /></div>
  </dialog>
  <script>
    const pages = ['intro', 'sheet1', 'sheet2', 'sheet3', 'sheet4', 'sheet5', 'sheet6', 'sheet7', 'outro'].map(name => `assets/${name}.jpeg`);
    const labels = ['الغلاف', 'حلويات', 'بان كيك ووافل', 'قهوة كلاسيك', 'قهوة مميزة وفرابيه', 'آيس كوفي وماتشا', 'مشروبات منعشة', 'ميلك شيك وعصائر', 'الختام'];
    const pageBox = document.getElementById('pageBox');
    const flipPage = document.getElementById('flipPage');
    const viewer = document.getElementById('viewer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const counter = document.getElementById('counter');
    const sections = document.getElementById('sections');
    const status = document.getElementById('status');
    const zoomDialog = document.getElementById('zoomDialog');
    const zoomImage = document.getElementById('zoomImage');
    const zoomScroll = document.getElementById('zoomScroll');
    const zoomScale = document.getElementById('zoomScale');
    const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const numbers = new Intl.NumberFormat('ar-u-nu-arab');
    const cache = new Map();
    let current = 0;
    let locked = false;
    let gesture = null;
    let turnTimer;
    let incomingPage = null;

    function loadPage(index) {
      if (!cache.has(index)) {
        const img = new Image();
        img.alt = `قائمة دهب — ${labels[index]}`;
        img.draggable = false;
        const ready = new Promise((resolve, reject) => { img.onload = () => resolve(img); img.onerror = () => { cache.delete(index); reject(new Error('image-load')); }; });
        cache.set(index, ready);
        img.src = pages[index];
      }
      return cache.get(index);
    }
    function updateControls() {
      prevBtn.disabled = locked || current === 0;
      nextBtn.disabled = locked || current === pages.length - 1;
      document.getElementById('zoomBtn').disabled = locked || !pageBox.firstChild;
      sections.querySelectorAll('button').forEach((btn, index) => { btn.disabled = locked; if (index === current) btn.setAttribute('aria-current', 'page'); else btn.removeAttribute('aria-current'); });
      counter.textContent = `${numbers.format(current + 1)} من ${numbers.format(pages.length)}`;
      viewer.setAttribute('aria-busy', String(locked));
    }
    function preloadNeighbors() {
      [current - 1, current + 1].filter(index => index >= 0 && index < pages.length).forEach(index => loadPage(index).catch(() => {}));
    }
    function finishTurn() {
      clearTimeout(turnTimer);
      if (incomingPage) { pageBox.replaceChildren(incomingPage); incomingPage = null; }
      flipPage.className = 'flip-page';
      flipPage.replaceChildren();
      locked = false;
      updateControls();
    }
    async function goTo(target) {
      if (locked || target === current || target < 0 || target >= pages.length) return;
      locked = true;
      status.textContent = 'جارٍ تحميل الصفحة…';
      updateControls();
      try {
        const img = await loadPage(target);
        const forward = target > current;
        const turningImage = forward ? pageBox.firstChild : img;
        if (turningImage && !motion.matches) flipPage.replaceChildren(turningImage.cloneNode());
        incomingPage = img.cloneNode();
        if (forward || motion.matches || !turningImage) {
          pageBox.replaceChildren(incomingPage);
          incomingPage = null;
        }
        current = target;
        status.textContent = '';
        updateControls();
        preloadNeighbors();
        if (!turningImage || motion.matches) finishTurn();
        else {
          flipPage.className = `flip-page active ${forward ? 'next-open' : 'prev-open'}`;
          turnTimer = setTimeout(finishTurn, 650);
        }
      } catch (error) {
        status.textContent = 'تعذّر تحميل الصفحة. جرّب مرة ثانية.';
        finishTurn();
      }
    }
    flipPage.addEventListener('animationend', event => { if (event.target === flipPage && ['turnNext', 'turnPrev'].includes(event.animationName)) finishTurn(); });
    labels.forEach((label, index) => { const btn = document.createElement('button'); btn.className = 'section-btn'; btn.textContent = label; btn.addEventListener('click', () => goTo(index)); sections.append(btn); });
    nextBtn.addEventListener('click', () => goTo(current + 1));
    prevBtn.addEventListener('click', () => goTo(current - 1));
    viewer.addEventListener('pointerdown', event => { if (!event.isPrimary || event.button !== 0) { gesture = null; return; } gesture = { id: event.pointerId, x: event.clientX, y: event.clientY }; viewer.setPointerCapture(event.pointerId); });
    viewer.addEventListener('pointerup', event => { if (!gesture || gesture.id !== event.pointerId) return; const dx = event.clientX - gesture.x; const dy = event.clientY - gesture.y; gesture = null; if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.3) return; goTo(current + (dx > 0 ? 1 : -1)); });
    viewer.addEventListener('pointercancel', () => { gesture = null; });
    document.addEventListener('keydown', event => {
      if (zoomDialog.open || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
      let target;
      if (event.key === 'ArrowLeft') target = current + 1;
      if (event.key === 'ArrowRight') target = current - 1;
      if (event.key === 'Home') target = 0;
      if (event.key === 'End') target = pages.length - 1;
      if (target !== undefined) { event.preventDefault(); goTo(target); }
    });
    document.getElementById('zoomBtn').addEventListener('click', () => {
      zoomImage.src = pages[current]; zoomImage.alt = `قائمة دهب — ${labels[current]}`;
      zoomImage.style.width = '100%'; zoomScale.setAttribute('aria-pressed', 'false'); zoomScale.textContent = 'تكبير أكثر +';
      zoomDialog.showModal(); zoomScroll.scrollTo(0, 0);
    });
    zoomScale.addEventListener('click', () => { const expanded = zoomScale.getAttribute('aria-pressed') !== 'true'; zoomScale.setAttribute('aria-pressed', String(expanded)); zoomScale.textContent = expanded ? 'تصغير −' : 'تكبير أكثر +'; zoomImage.style.width = expanded ? '180%' : '100%'; });
    document.getElementById('closeZoom').addEventListener('click', () => zoomDialog.close());
    zoomDialog.addEventListener('click', event => { if (event.target === zoomDialog) { const rect = zoomDialog.getBoundingClientRect(); if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) zoomDialog.close(); } });
    async function initialize() {
      locked = true; updateControls(); status.textContent = 'جارٍ تحميل المنيو…';
      try { const img = await loadPage(current); pageBox.replaceChildren(img.cloneNode()); status.textContent = ''; preloadNeighbors(); }
      catch (error) { status.textContent = 'تعذّر تحميل الغلاف. اختَر قسمًا أو حدّث الصفحة للمحاولة ثانية.'; }
      locked = false; updateControls();
    }
    initialize();
  </script>
</body>
</html>
